name: CI & Security Guard

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sensitive-file-guard:
    name: Sensitive & Auth File Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect forbidden file changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          if [[ "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git ls-tree -r --name-only "$head_sha")"
          else
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          fi

          # Menjaga folder auth Baileys, credentials Google, dan .env Fuenzer Bot
          forbidden_files="$(printf '%s\n' "$changed_files" | grep -E '(^|/)\.env$|(^|/)auth(/|$)|(^|/)credentials(/|$)|(^|/)temp/.*' || true)"

          if [[ -n "$forbidden_files" ]]; then
            echo "❌ Detected sensitive/secret files that are forbidden to commit:"
            printf '%s\n' "$forbidden_files"
            echo "Don't commit .env files, auth/, credentials/, or temp/ folders. Use .env.example."
            exit 1
          fi

          echo "✅ Safe: No sensitive files committed."

  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: sensitive-file-guard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  syntax-check:
    name: Node.js Syntax Verification
    runs-on: ubuntu-latest
    needs: sensitive-file-guard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify JavaScript Syntax
        run: |
          echo "Verifying JS file syntax in src/..."
          node -c src/index.js
          find src -name "*.js" -exec node -c {} +
          echo "✅ All JS files have valid syntax."